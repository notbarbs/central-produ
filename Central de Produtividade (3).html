<style>

*{box-sizing:border-box}html,body{margin:0}

.pnum{font-family:Sora,Inter,system-ui,sans-serif;font-size:26px;color:var(--ac);width:20px;flex:none;line-height:1.1}

.filters{display:flex;flex-direction:column;gap:10px;margin:12px 0 6px}.fsel select,.fsel input{padding:5px 9px;font-size:13px;width:auto;min-width:0}

::placeholder{color:var(--mu2)}
.qa input{background:transparent;border-style:dashed}
.empty{text-align:center;color:var(--mu);padding:26px 10px;font-size:14px}
.tl{position:relative;padding-left:24px;margin-top:12px}.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:8px;width:1px;background:var(--bd2)}
.ev{position:relative;padding:0 0 16px}.ev:before{content:"";position:absolute;left:-24px;top:5px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px solid var(--bd2)}
.ev.now:before{background:var(--ac);border-color:var(--ac);box-shadow:0 0 0 4px var(--acs)}.ev.nx:before{border-color:var(--ac)}.ev.d{opacity:.55}
.ev .tm2{font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.side>section+section{margin-top:28px}
.hl{display:flex;align-items:center;gap:10px;padding:6px 0}
.dots{display:flex;gap:3px}.dots i{width:11px;height:11px;border-radius:3px;background:var(--bd)}.dots i.on{background:var(--ac)}.dots i.off{background:transparent;border:1px dashed var(--bd2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.big{font-size:30px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.chart{width:100%;height:auto;display:block}.chart .bar{fill:var(--acl)}.chart .bar.last{fill:var(--ac)}.chart .axis{stroke:var(--bd2)}.chart text{fill:var(--mu);font-size:10px;font-family:Inter,sans-serif}.chart .ln{fill:none;stroke:var(--ac);stroke-width:2}.chart .ar{fill:var(--acs)}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);grid-auto-columns:13px;gap:3px;overflow:auto;padding-bottom:4px}.hm i{border-radius:3px;background:var(--s3);border:1px solid var(--bd)}
.hm i.f,.hm .hc.f{opacity:.35}.hm .hc{all:unset;box-sizing:border-box;border-radius:3px;background:var(--s3);border:1px solid var(--bd);cursor:pointer}.hm .hc.l4{background:var(--ac);border-color:var(--ac)}.hm .hc:focus-visible{outline:2px solid var(--ac);outline-offset:1px}.hm i.l1{background:color-mix(in srgb,var(--ac) 25%,var(--s3))}.hm i.l2{background:color-mix(in srgb,var(--ac) 48%,var(--s3))}.hm i.l3{background:color-mix(in srgb,var(--ac) 72%,var(--s3))}.hm i.l4{background:var(--ac)}
.cm{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:var(--s2)}

.cm .c.o{opacity:.4}.cm .c.t .n{background:var(--ac);color:var(--on);border-radius:20px}.cm .n{display:inline-block;min-width:22px;text-align:center;font-weight:500;padding:0 4px}
.cm .e{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--mu);padding:1px 0}.cm .e.d{text-decoration:line-through;opacity:.6}.cm .c .pl{position:absolute;right:4px;top:4px;opacity:0}.cm .c:hover .pl{opacity:1}
.wkc{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}.wkc .pan{padding:12px;font-size:13px}.wkc .pan.t{border-color:var(--ac)}
.it{display:flex;gap:6px;padding:2px 0;cursor:pointer;align-items:flex-start}.it.d{text-decoration:line-through;color:var(--mu)}
.load{height:8px;border-radius:9px;background:var(--bd);overflow:hidden;margin:8px 0}.load i{display:block;height:100%;background:var(--ac)}.load.over i{background:var(--wa)}
.set{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-bottom:1px solid var(--bd)}.set:last-child{border:0}.set>div:first-child{min-width:0}.set>div:last-child{flex:none}

.foc{text-align:center;padding:36px 20px}.foc select{max-width:380px;margin:0 auto 18px;display:block}

#foc:fullscreen{display:flex;flex-direction:column;justify-content:center;align-items:center;background:var(--bg);border:0}
.mood{display:flex;gap:6px;flex-wrap:wrap}

.body.compact .tr{padding:7px 4px}

body{background:radial-gradient(900px 520px at 88% -8%,color-mix(in srgb,var(--vi) 16%,transparent),transparent 62%),radial-gradient(800px 520px at 0% 0%,color-mix(in srgb,var(--ac) 11%,transparent),transparent 60%),var(--bg);background-attachment:fixed}

/* ================= Foco / timer ================= */
const tmDur=()=>(S.timer.m==="foco"?S.cfg.foco:S.cfg.pausa)*60000;
const tmLeft=()=>{const T=S.timer;return T.st==="run"?Math.max(0,T.end-Date.now()):T.st==="pause"?T.left:tmDur()};
const tmFmt=ms=>{const s=Math.ceil(ms/1000);return p2(Math.floor(s/60))+":"+p2(s%60)};
function beep(){if(!S.cfg.som)return;try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.3].forEach(t=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.setValueAtTime(.0001,c.currentTime+t);g.gain.exponentialRampToValueAtTime(.2,c.currentTime+t+.02);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+t+.25);o.connect(g);g.connect(c.destination);o.start(c.currentTime+t);o.stop(c.currentTime+t+.3)})}catch(e){}}
function notify(t,b){beep();if(S.cfg.notif&&"Notification" in window&&Notification.permission==="granted"){try{new Notification(t,{body:b})}catch(e){}}}
function tmDone(){const T=S.timer;if(T.st!=="run")return;const f=T.m==="foco",mins=Math.round(T.total/60000);T.st="idle";T.m=f?"pausa":"foco";
 if(f){const id=uid();S.focus.push({id,date:today(),min:mins,task:T.task,at:Date.now()});if(mins>=10)award("f:"+id,15,"Sessão de foco");notify("Sessão de foco concluída","Hora de uma pausa.");toast("Sessão de foco concluída. Hora da pausa.")}
 else{notify("Pausa encerrada","Pronto para o próximo foco?");toast("Pausa encerrada. Pronto para o próximo foco?")}save();render()}
function tmTick(){const T=S.timer;if(T.st==="run"&&Date.now()>=T.end){tmDone();return}const el=$("#tm");if(el)el.textContent=tmFmt(tmLeft());document.title=(T.st==="run"?tmFmt(tmLeft())+" · ":"")+"Central de Produtividade"}

function openSearch(){const d=$("#dlg");d.innerHTML='<div><input id="sq" placeholder="Buscar tarefas, metas, projetos, notas e diário…" autocomplete="off" aria-label="Buscar"><div id="sr" style="margin-top:12px;max-height:55vh;overflow:auto"></div></div>';d.showModal();$("#sq").oninput=srRun;$("#sq").onkeydown=e=>{if(e.key==="Enter"){const b=$("#sr button");if(b)b.click()}};srRun()}
function srRun(){const q=$("#sq").value.trim().toLowerCase(),r=[];
 if(q){S.tasks.forEach(t=>{if((t.title+" "+t.cat+" "+t.notes+" "+t.subs.map(s=>s.t).join(" ")).toLowerCase().includes(q))r.push(["task",t.id,t.title,"Tarefa · "+fmt(t.date)])});
  S.goals.forEach(g=>{if((g.title+" "+(g.desc||"")+" "+(g.next||"")+" "+g.milestones.map(m=>m.t).join(" ")).toLowerCase().includes(q))r.push(["goal",g.id,g.title,g.kind==="projeto"?"Projeto":"Meta"])});
  S.inbox.forEach(i=>{if(i.text.toLowerCase().includes(q))r.push(["ib",i.id,i.text,i.kind==="nota"?"Nota":"Caixa de entrada"])});
  Object.keys(S.diary).sort().reverse().forEach(k=>{const x=S.diary[k];if(["events","learn","wins","hard","improve"].some(f=>(x[f]||"").toLowerCase().includes(q)))r.push(["dia",k,"Registro de "+fmt(k),"Diário"])})}
 $("#sr").innerHTML=r.length?r.slice(0,30).map(x=>`<button class="btn sr" data-a="sx" data-t="${x[0]}" data-id="${x[1]}">${esc(x[2])} <span class="mu">${x[3]}</span></button>`).join(""):`<div class="empty">${q?"Nada encontrado.":"Digite para buscar."}</div>`}
/* ================= Backup ================= */
function importJSON(txt){let j;try{j=JSON.parse(txt)}catch(e){return"Backup inválido: o texto não é um JSON legível. Nada foi alterado."}
 const d=j&&j.data?j.data:j;if(!d||typeof d!=="object"||!Array.isArray(d.tasks)||!Array.isArray(d.xp))return"Backup inválido: faltam tarefas ou histórico de XP. Nada foi alterado.";
 const dateOk=s=>typeof s==="string"&&/^\d{4}-\d{2}-\d{2}$/.test(s);
 const ok=d.tasks.every(t=>t&&typeof t.id==="string"&&typeof t.title==="string"&&dateOk(t.date))&&d.xp.every(x=>x&&typeof x.key==="string"&&typeof x.xp==="number")&&(d.goals===undefined||Array.isArray(d.goals)&&d.goals.every(g=>g&&typeof g.id==="string"))&&(d.habits===undefined||Array.isArray(d.habits)&&d.habits.every(h=>h&&typeof h.id==="string"&&typeof h.name==="string"))&&(d.hlog===undefined||typeof d.hlog==="object"&&d.hlog!==null)&&(d.inbox===undefined||Array.isArray(d.inbox))&&(d.focus===undefined||Array.isArray(d.focus));
 if(!ok)return"Backup inválido: há registros com formato incorreto. Nada foi alterado.";
 if(!confirm("Substituir TODOS os dados atuais por este backup?"))return"Importação cancelada.";
 const prev=S;S=d;try{fix()}catch(e){S=prev;return"Backup inválido: não foi possível interpretar a estrutura. Nada foi alterado."}save();render();return"Backup importado com sucesso."}

async function cloudRead(){const c=col(),m=await c.doc("meta").get();if(!m.exists)return null;const d=m.data();let s="";
 for(let i=0;i<d.n;i++){const x=await c.doc("s"+i).get();if(!x.exists)throw new Error("incompleto");s+=x.data().t}CL.ts=d.ts||0;CL.n=d.n;return s}
async function cloudWrite(s){const c=col(),parts=[];for(let i=0;i<s.length;i+=CH)parts.push(s.slice(i,i+CH));if(!parts.length)parts.push("");
 for(let i=0;i<parts.length;i++)await c.doc("s"+i).set({t:parts[i]});
 const ts=Date.now();await c.doc("meta").set({n:parts.length,ts});
 for(let i=parts.length;i<CL.n;i++){try{await c.doc("s"+i).delete()}catch(e){}}
 CL.n=parts.length;CL.ts=ts;CL.at=ts}
function cloudSave(s){CL.dirty=s;try{if(CL.id)localStorage.setItem("cpp_cache_"+CL.id,s)}catch(e){}
 if(!CL.db||s===CL.last)return;CL.st="p";paintSt();clearTimeout(CL.t);CL.t=setTimeout(cloudFlush,700)}
async function cloudFlush(){clearTimeout(CL.t);if(CL.busy||CL.dirty==null||!CL.db)return;const s=CL.dirty;if(s===CL.last){CL.st="ok";paintSt();return}
 CL.busy=true;try{await cloudWrite(s);CL.last=s;CL.st=CL.dirty===s?"ok":"p"}catch(e){CL.st="e";setTimeout(cloudFlush,5000)}
 CL.busy=false;paintSt();if(CL.st==="p")cloudFlush()}
async function cloudPull(){if(!CL.db||CL.busy||CL.dirty!==CL.last&&CL.dirty!=null)return;
 try{const m=await col().doc("meta").get();if(!m.exists||(m.data().ts||0)<=CL.ts)return;const s=await cloudRead();if(s==null)return;
  CL.last=CL.dirty=s;window.__raw=s;load();CL.at=Date.now();render();toast("Dados atualizados de outro dispositivo.")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)cloudFlush();else cloudPull()});
window.addEventListener("pagehide",()=>{cloudFlush()});

const gate=document.getElementById("gate"),gbox=document.getElementById("gbox");
const gset=h=>{gbox.innerHTML=`<div class="brand" style="justify-content:center;padding:0">${LOGO}</div>`+h};
const gload=t=>gset(`<h1>${esc(t)}</h1><div class="gsp" role="status"></div>`);
function gUnavailable(){gset(`<h1>Entre para continuar</h1><p>Para guardar seus dados por conta, abra este site pelo link publicado e entre na sua conta Claude. Assim tudo abre igual em qualquer computador ou celular.</p><button class="btn pri" id="gretry">Tentar novamente</button><div class="gfoot">Seus dados nunca ficam presos a um único aparelho.</div>`);document.getElementById("gretry").onclick=()=>location.reload()}
async function gInit(){gload("Conectando…");
 let user=null,db=null;try{if(window.claude&&claude.use){user=await claude.use("user");db=await claude.use("db")}}catch(e){}
 if(!user||!db){gUnavailable();return}
 let id=null,me=null;try{id=await user.id();me=await user.me()}catch(e){}
 if(!id){gUnavailable();return}
 CL.db=db;CL.id=id;CL.me=me;const nm=(me&&me.name||"").trim()||"você",first=nm.split(" ")[0];window.__defName=first==="você"?"":first;
 if(sessionStorage.getItem("cpp_in")===id){gEnter();return}
 gset(`<div class="gav" aria-hidden="true">${esc(nm.charAt(0).toUpperCase())}</div><h1>Olá, ${esc(first)}</h1><p>Sua Central de Produtividade está pronta. Tudo o que você salvar fica vinculado a esta conta.</p><button class="btn pri" id="gin">Entrar na minha Central</button><div class="gfoot">Conectado como ${esc(nm)}</div>`);
 const b=document.getElementById("gin");b.onclick=gEnter;b.focus()}
async function gEnter(){gload("Carregando seus dados…");
 let raw=null;try{raw=await cloudRead()}catch(e){
  let cache=null;try{cache=localStorage.getItem("cpp_cache_"+CL.id)}catch(x){}
  if(!cache){gset(`<h1>Não foi possível carregar</h1><p>Verifique sua conexão e tente de novo. Seus dados continuam seguros na conta.</p><button class="btn pri" id="gretry">Tentar novamente</button>`);document.getElementById("gretry").onclick=()=>gEnter();return}
  raw=cache;CL.st="e"}
 let migrated=false;
 if(raw==null){let loc=null;try{loc=localStorage.getItem("cpp_v1")}catch(e){}
  if(loc&&confirm("Encontrei dados salvos neste navegador. Importar para a sua conta?")){raw=loc;migrated=true}}
 try{sessionStorage.setItem("cpp_in",CL.id)}catch(e){}
 window.__raw=raw;CL.last=CL.dirty=(raw==null||migrated)?"":raw;
 gate.hidden=true;document.body.classList.remove("locked");window.__boot();paintSt();
 if(migrated)setTimeout(()=>toast("Dados deste navegador copiados para a sua conta.",true),700)}
function sair(){cloudFlush().finally(()=>{try{sessionStorage.removeItem("cpp_in")}catch(e){}location.reload()})}
Object.assign(A,{sair:()=>{sair();return false},sync:()=>{CL.last="";cloudSave(JSON.stringify(S));cloudFlush();toast("Sincronizando…");return false}});
function vConta(){const nm=(CL.me&&CL.me.name)||"Sua conta";
 return head("Conta","Seus dados ficam vinculados a esta conta e abrem em qualquer dispositivo.")+`<div style="max-width:760px"><section class="pan"><div class="acc"><div class="gav" aria-hidden="true">${esc(nm.charAt(0).toUpperCase())}</div><div style="flex:1;min-width:200px"><h3>${esc(nm)}</h3><div class="mu"><i class="cdot" data-cdot></i> <span data-cloud></span></div></div><div class="row"><button class="btn" data-a="sync">${I("reset")} Sincronizar agora</button><button class="btn" data-a="sair">${I("out")} Sair</button></div></div></section><section class="pan"><h3>Como funciona</h3><p class="mu" style="margin:8px 0 0">Cada conta tem seu próprio espaço privado: tarefas, hábitos, metas, diário e finanças ficam salvos na nuvem, não no computador. Para usar com outra pessoa, ela entra com a conta dela e vê apenas os dados dela. Ao tocar em Sair, a Central volta para a tela de entrada neste aparelho.</p></section></div>`}
VIEWS.conta=vConta;
gInit();
</script></body></html>
